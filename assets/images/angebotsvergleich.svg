<text x="44" y="48" fill="#245b47" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">ANGEBOTE · VERGLEICH</text>
<text x="44" y="108" fill="#243b35" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" text-anchor="start">Angebote auf gleicher Grundlage prüfen</text>
