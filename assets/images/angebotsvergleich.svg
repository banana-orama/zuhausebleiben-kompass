<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc">
<title id="title">Angebote auf gleicher Grundlage prüfen</title>
<desc id="desc">Drei neutrale Angebotsblöcke A, B und C mit identischen Prüfpunkten: Leistungen, Zusatzarbeiten, Wartung und Bedingungen. Es sind keine echten Angebote, Anbieter, Bewertungen oder Preise dargestellt. Unklare Punkte schriftlich klären und nur vergleichbare Leistungsumfänge gegenüberstellen.</desc>
