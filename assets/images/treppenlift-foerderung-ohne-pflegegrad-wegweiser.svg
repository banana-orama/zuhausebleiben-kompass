<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t1 d1">
  <title id="t1">Wegweiser: vier Wege zur Treppenlift-Finanzierung ohne Pflegegrad</title>
  <desc id="d1">Fuenf Baender mit Träger und Bedingung: Schritt 0 Pflegegrad-Route pruefen, Unfallversicherung, Eingliederungshilfe, Sozialamt-Hilfe zur Pflege, Grenzen von Rentenversicherung und Krankenkasse. Rechtsstand 11.11.2026.</desc>
  <rect width="780" height="620" fill="#f4f7f5"/>
  <rect width="780" height="64" fill="#1e5f4b"/>
  <text x="24" y="40" font-size="21" font-weight="700" fill="#ffffff">Ohne Pflegegrad: Welcher Traeger kommt in Frage?</text>
  <rect x="24" y="72" width="732" height="2" fill="#d8e2dc"/>

  <!-- Band 0: Schritt 0 -->
  <rect x="24" y="92" width="732" height="84" rx="12" fill="#ffffff" stroke="#d8e2dc" class="chip"/>
  <circle cx="56" cy="134" r="17" fill="#1e5f4b"/>
  <text x="56" y="140" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
  <text x="84" y="124" font-size="16" font-weight="700" fill="#123b2f">Schritt 0: Pflegegrad-Route zuerst pruefen</text>
  <text x="84" y="146" font-size="13" fill="#2f4f43">Bleibt der einzige Weg mit fester Zuschusshoehe. Vor dem Antrag:</text>
  <text x="84" y="164" font-size="13" fill="#1e5f4b" font-weight="700">EUTB-Beratung nutzen — kostenlos und unabhaengig.</text>

  <!-- Band 1: Unfallversicherung -->
  <rect x="24" y="184" width="732" height="84" rx="12" fill="#ffffff" stroke="#d8e2dc" class="chip"/>
  <circle cx="56" cy="226" r="17" fill="#1e5f4b"/>
  <text x="56" y="232" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="216" font-size="16" font-weight="700" fill="#123b2f">Unfallversicherung (BG / Unfallkasse)</text>
  <text x="84" y="238" font-size="13" fill="#2f4f43">Ursache: Arbeitsunfall oder Berufskrankheit. Soziale Teilhabe ohne</text>
  <text x="84" y="256" font-size="13" fill="#2f4f43">Einkommenspruefung. § 26 SGB VII</text>

  <!-- Band 2: Eingliederungshilfe -->
  <rect x="24" y="276" width="732" height="84" rx="12" fill="#ffffff" stroke="#d8e2dc" class="chip"/>
  <circle cx="56" cy="318" r="17" fill="#1e5f4b"/>
  <text x="56" y="324" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="308" font-size="16" font-weight="700" fill="#123b2f">Eingliederungshilfe (Landesträger)</text>
  <text x="84" y="330" font-size="13" fill="#2f4f43">Behinderung im Sinne des § 2 SGB IX. Umbau von Wohnraum: § 77 SGB IX.</text>
  <text x="84" y="348" font-size="13" fill="#2f4f43">Beitrag aus Einkommen ab Schwellen (§ 136 SGB IX), Darlehen moeglich.</text>

  <!-- Band 3: Sozialamt -->
  <rect x="24" y="368" width="732" height="84" rx="12" fill="#ffffff" stroke="#d8e2dc" class="chip"/>
  <circle cx="56" cy="410" r="17" fill="#1e5f4b"/>
  <text x="56" y="416" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="84" y="400" font-size="16" font-weight="700" fill="#123b2f">Sozialamt — Hilfe zur Pflege (§ 64e SGB XII)</text>
  <text x="84" y="422" font-size="13" fill="#2f4f43">Nur bei Pflegebedürftigkeit (§ 61a: Kriterium „Treppensteigen") und</text>
  <text x="84" y="440" font-size="13" fill="#2f4f43">knapper Kasse. Ermessen, kein fester Betrag, Nachrang der Sozialhilfe.</text>

  <!-- Band 4: Grenzen -->
  <rect x="24" y="460" width="732" height="84" rx="12" fill="#f2f2f2" stroke="#d8d8d8" class="chip"/>
  <circle cx="56" cy="502" r="17" fill="#8a8a8a"/>
  <text x="56" y="508" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="84" y="492" font-size="16" font-weight="700" fill="#4a4a4a">Keine Route: Rentenversicherung / Krankenkasse</text>
  <text x="84" y="514" font-size="13" fill="#5c5c5c">RV: Wohnungshilfen nur „vor der Wohnungstuer" (Arbeitsweg, § 9 SGB VI).</text>
  <text x="84" y="532" font-size="13" fill="#5c5c5c">KK: Lift ist kein Hilfsmittel (nicht tragbar) — ohne Pflegegrad keine Route.</text>

  <!-- Footer -->
  <rect x="24" y="566" width="732" height="2" fill="#d8e2dc"/>
  <text x="24" y="590" font-size="12" fill="#2f4f43">Rechtsstand 11.11.2026 · KI-Illustration · schematisch — ersetzt keine individuelle Beratung</text>
</svg>
