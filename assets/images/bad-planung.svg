<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
<title id="title">Badplanung: Zugang, Halt und Raum</title>
<desc id="desc">Schematische Draufsicht auf ein Bad mit Dusche, angedeuteter Haltemöglichkeit, Waschbecken und einer gestrichelten Freiraumfläche. Drei Fragen betreffen Duschzugang, fachlich zu klärende Haltemöglichkeiten und Bewegung mit Hilfsmitteln. Die Fläche stellt kein Normmaß dar.</desc>
