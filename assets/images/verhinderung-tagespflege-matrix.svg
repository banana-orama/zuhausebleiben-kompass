<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Verhinderungspflege und Tagespflege im Vergleich</title>
<desc id="desc">Schematische Gegenueberstellung zweier Leistungen ohne Personen: Verhinderungspflege als Ersatzpflege zu Hause mit bis zu acht Wochen im Kalenderjahr und Gemeinsamem Jahresbetrag von bis zu 3.539 Euro; Tagespflege als teilstationaeres Angebot mit monatlichen Hoechstbetraegen von 721 bis 2.085 Euro je nach Pflegegrad einschliesslich Befoerderung.</desc>
<rect width="1200" height="760" fill="#f7f5ef"/>
<text x="44" y="48" fill="#245b47" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600">PFLEGE ZU HAUSE · ENTSCHEIDUNGSHILFE</text>
<text x="44" y="106" fill="#243b35" font-family="Georgia,'Times New Roman',serif" font-size="40">Verhinderungspflege oder Tagespflege?</text>
<rect x="60" y="150" width="520" height="430" rx="14" fill="#ffffff" stroke="#245b47" stroke-width="3"/>
<text x="90" y="196" fill="#245b47" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="21" font-weight="600">Verhinderungspflege (§ 39 SGB XI)</text>
<text x="90" y="240" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20" font-weight="600">Wann</text>
<text x="90" y="268" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Pflegeperson verhindert: Urlaub,</text>
<text x="90" y="292" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Krankheit, andere Gründe · Ersatz</text>
<text x="90" y="316" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">in den eigenen Wänden</text>
<text x="90" y="360" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20" font-weight="600">Rahmen</text>
<text x="90" y="388" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">bis zu 8 Wochen je Kalenderjahr ·</text>
<text x="90" y="412" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Budget: Gemeinsamer Jahresbetrag</text>
<text x="90" y="436" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">bis 3.539 € (mit Kurzzeitpflege)</text>
<text x="90" y="480" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20" font-weight="600">Besonderheit</text>
<text x="90" y="508" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">nahe Angehörige ohne Erwerbsmäßigkeit:</text>
<text x="90" y="532" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">regelmäßig Pflegegeldbetrag für</text>
<text x="90" y="556" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">2 Monate (§ 39 Abs. 3)</text>
<rect x="620" y="150" width="520" height="430" rx="14" fill="#ffffff" stroke="#245b47" stroke-width="3"/>
<text x="650" y="196" fill="#245b47" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="21" font-weight="600">Tagespflege (§ 41 SGB XI)</text>
<text x="650" y="240" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20" font-weight="600">Wann</text>
<text x="650" y="268" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">häusliche Pflege nicht ausreichend</text>
<text x="650" y="292" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">oder zur Ergänzung · tagsüber in</text>
<text x="650" y="316" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">der Einrichtung, mit Beförderung</text>
<text x="650" y="360" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20" font-weight="600">Beträge je Monat</text>
<text x="650" y="388" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Grad 2: 721 € · Grad 3: 1.357 € ·</text>
<text x="650" y="412" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Grad 4: 1.685 € · Grad 5: 2.085 €</text>
<text x="650" y="436" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">(§ 41 Abs. 2 SGB XI)</text>
<text x="650" y="480" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20" font-weight="600">Besonderheit</text>
<text x="650" y="508" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">zusätzlich zu Sachleistung oder</text>
<text x="650" y="532" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Pflegegeld · Unterkunft und</text>
<text x="650" y="556" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Verpflegung bleiben privat</text>
<rect x="60" y="606" width="1080" height="70" rx="14" fill="#eae4d5" stroke="#d8dfd6" stroke-width="2"/>
<text x="90" y="636" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="22" font-weight="600">Gemeinsame Grundlage</text>
<text x="90" y="628" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Grad 1: kein teilstationärer Anspruch, bis zu 131 € Entlastungsbetrag</text>
<path d="M44 692 H1156" fill="none" stroke="#d8dfd6" stroke-width="2"/>
<text x="44" y="722" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="21">Beträge nach SGB XI und BMG, Abruf 16.10.2026 · dynamisiert nach § 30 SGB XI.</text>
<text x="44" y="748" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="21">Keine individuelle Leistungsberatung. Ob Ihr Fall passt, prüft die Pflegekasse.</text>
<text x="1006" y="748" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="21" text-anchor="end">KI-Illustration</text>
</svg>
