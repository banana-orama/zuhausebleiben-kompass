<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Treppenlift in der Eigentumswohnung: Wer entscheidet?</title>
  <desc id="svgDesc">Entscheidungspfad: eigene Treppe ohne Gemeinschaft, WEG-Beschluss nach § 20 für Eigentümer, Weg über den Vermieter für Mieter, vor jedem Einbau die Prüfung von Brandschutz und Bauordnung.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
    .start { fill:#eef6f1; stroke:#2f6f4f; stroke-width:2; }
    .decision { fill:#fdf7ec; stroke:#b08330; stroke-width:2; }
    .result { fill:#f4f7fb; stroke:#3b6ea5; stroke-width:2; }
    .note { fill:#fff7f7; stroke:#c0392b; stroke-width:1.5; }
    .lbl { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:17px; fill:#1f2937; }
    .lbl-b { font-weight:700; }
    .small { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; fill:#475569; }
    .edge { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; fill:#374151; font-weight:600; }
    .marker { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; font-weight:700; fill:#ffffff; }
    .circ { stroke:#ffffff; stroke-width:2; }
    .line { stroke:#374151; stroke-width:2; fill:none; }
  </style>

  <rect x="0" y="0" width="1100" height="780" fill="#f8fafc"/>
  <text x="550" y="46" text-anchor="middle" class="lbl lbl-b" font-size="22">Treppenlift geplant: Wer entscheidet?</text>

  <!-- (1) Start -->
  <rect class="box start" x="400" y="76" width="300" height="58" rx="12"/>
  <circle class="circ" cx="430" cy="105" r="14" fill="#2f6f4f"/>
  <text x="430" y="110" text-anchor="middle" class="marker">1</text>
  <text x="454" y="112" text-anchor="start" class="lbl lbl-b">Treppenlift geplant</text>

  <path class="line" d="M550,134 L550,168" marker-end="url(#arr)"/>

  <!-- D1 -->
  <rect class="box decision" x="360" y="172" width="380" height="64" rx="12"/>
  <text x="550" y="199" text-anchor="middle" class="lbl lbl-b">Treppe = Gemeinschaftseigentum?</text>
  <text x="550" y="221" text-anchor="middle" class="small">(Mehrfamilienhaus, Treppe wird geteilt)</text>

  <!-- D1 nein -> B (links) -->
  <path class="line" d="M360,204 L195,204 L195,286" marker-end="url(#arr)"/>
  <text x="288" y="198" text-anchor="middle" class="edge">nein</text>

  <!-- (2) Box B -->
  <rect class="box result" x="60" y="290" width="270" height="104" rx="12"/>
  <circle class="circ" cx="90" cy="318" r="14" fill="#3b6ea5"/>
  <text x="90" y="323" text-anchor="middle" class="marker">2</text>
  <text x="205" y="320" text-anchor="middle" class="lbl lbl-b">Eigene Treppe</text>
  <text x="205" y="340" text-anchor="middle" class="lbl lbl-b">im eigenen Haus</text>
  <text x="205" y="362" text-anchor="middle" class="small">Sie entscheiden selbst,</text>
  <text x="205" y="380" text-anchor="middle" class="small">kein WEG-Beschluss nötig</text>

  <!-- D1 ja -> D2 -->
  <path class="line" d="M550,236 L550,290" marker-end="url(#arr)"/>
  <text x="576" y="262" text-anchor="middle" class="edge">ja</text>

  <!-- D2 -->
  <rect class="box decision" x="360" y="294" width="380" height="64" rx="12"/>
  <text x="550" y="321" text-anchor="middle" class="lbl lbl-b">Wohnen Sie zur Miete?</text>
  <text x="550" y="343" text-anchor="middle" class="small">(Mietvertrag für Ihre Wohnung)</text>

  <!-- D2 ja -> C (rechts) -->
  <path class="line" d="M740,326 L935,326 L935,404" marker-end="url(#arr)"/>
  <text x="838" y="320" text-anchor="middle" class="edge">ja</text>

  <!-- (3) Box C -->
  <rect class="box result" x="800" y="408" width="270" height="126" rx="12"/>
  <circle class="circ" cx="824" cy="436" r="14" fill="#3b6ea5"/>
  <text x="824" y="441" text-anchor="middle" class="marker">3</text>
  <text x="945" y="441" text-anchor="middle" class="lbl lbl-b">Weg über den Vermieter</text>
  <text x="945" y="463" text-anchor="middle" class="small">Erlaubnis nach § 554 BGB</text>
  <text x="945" y="481" text-anchor="middle" class="small">beantragen; ggf. braucht auch</text>
  <text x="945" y="499" text-anchor="middle" class="small">die Gemeinschaft einen Beschluss</text>
  <text x="945" y="517" text-anchor="middle" class="small">Ratgeber: Mietwohnung</text>

  <!-- D2 nein -> E -->
  <path class="line" d="M550,358 L550,412" marker-end="url(#arr)"/>
  <text x="576" y="386" text-anchor="middle" class="edge">nein (Sie sind Eigentümer)</text>

  <!-- (4) Box E -->
  <rect class="box result" x="350" y="416" width="430" height="120" rx="12"/>
  <circle class="circ" cx="380" cy="444" r="14" fill="#3b6ea5"/>
  <text x="380" y="449" text-anchor="middle" class="marker">4</text>
  <text x="575" y="447" text-anchor="middle" class="lbl lbl-b">WEG-Beschluss nach § 20</text>
  <text x="575" y="471" text-anchor="middle" class="small">Antrag als Tagesordnungspunkt über die Verwaltung;</text>
  <text x="575" y="490" text-anchor="middle" class="small">einfache Stimmenmehrheit beschließt oder gestattet</text>
  <text x="575" y="509" text-anchor="middle" class="small">Sie tragen Kosten allein (§ 21 Abs. 1 WEG)</text>

  <path class="line" d="M565,536 L565,572" marker-end="url(#arr)"/>

  <!-- Hinweis -->
  <rect class="box note" x="240" y="576" width="620" height="64" rx="12"/>
  <text x="550" y="602" text-anchor="middle" class="lbl lbl-b">Vor jedem Einbau</text>
  <text x="550" y="624" text-anchor="middle" class="small">Brandschutz, Fluchtwege und Bauordnung durch den Fachbetrieb prüfen lassen</text>

  <!-- Legende -->
  <rect x="60" y="662" width="980" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="688" class="small lbl-b">Legende</text>
  <text x="80" y="710" class="small">(1) Ausgangspunkt: Einbau eines Treppenlifts geplant.  (2) Reihenhaus/Einfamilienhaus: keine Gemeinschaft, Sie entscheiden.</text>
  <text x="80" y="730" class="small">(3) Miete in einem Mehrfamilienhaus: Vermieter anfragen.  (4) Eigentumswohnung: Beschluss oder Gestattung nach § 20 WEG.</text>
  <text x="80" y="745" class="small">Schematische Orientierung, keine Rechtsberatung.</text>
</svg>
