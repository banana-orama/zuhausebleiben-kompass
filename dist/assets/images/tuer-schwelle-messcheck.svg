<text x="110" y="600" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="23" font-weight="600">Wofuer die Werte gut sind</text>
<text x="110" y="636" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20">Gespraech mit Fachbetrieb und Vermieter · Rampe passend zur Hoehe auswaehlen · Pflegekassen-Antrag konkret beschreiben.</text>
<path d="M44 700 H1156" fill="none" stroke="#d8dfd6" stroke-width="2"/>
<text x="44" y="736" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="22">Messbeispiel ohne Massstab. Die Grafik bestaetigt keine Normerfuellung Ihrer Tuer.</text>
