<line x1="760" y1="510" x2="860" y2="510" stroke="#245b47" stroke-width="3"/>
<line x1="820" y1="510" x2="820" y2="470" stroke="#b3402e" stroke-width="4"/>
<text x="838" y="486" fill="#b3402e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="22" font-weight="600">Hoehe</text>
<text x="838" y="516" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20">der Schwelle</text>
<rect x="900" y="180" width="220" height="330" rx="14" fill="#ffffff" stroke="#d8dfd6" stroke-width="2"/>
<text x="920" y="220" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="22" font-weight="600">Notizbogen</text>
