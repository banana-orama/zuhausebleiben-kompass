<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Tuer und Schwelle messen: Schrittmass und Notizbogen</title>
<desc id="desc">Schematische Darstellung ohne Personen: Tuerblatt mit Massband, lichte Durchgangsbreite an der engsten Stelle messen, Schwellenhoehe mit Lineal pruefen, Masswerte in einen Notizbogen eintragen. Keine Normbestaetigung und keine Ausfuehrungsplanung.</desc>
<rect width="1200" height="760" fill="#f7f5ef"/>
<text x="44" y="48" fill="#245b47" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600">WOHNRAUM · MESSCHECK</text>
<text x="44" y="106" fill="#243b35" font-family="Georgia,'Times New Roman',serif" font-size="42">Erst messen, dann planen</text>
