<text x="920" y="286" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Tuer / Ort: ______</text>
<text x="920" y="322" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Breite: ______ cm</text>
<text x="920" y="358" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Schwelle: ______ cm</text>
<text x="920" y="394" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Oeffnung: innen/außen</text>
<text x="920" y="430" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Hilfsmittel: ______</text>
<text x="920" y="466" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19">Foto gemacht: ja/nein</text>
