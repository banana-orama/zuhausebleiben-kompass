<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Licht im Tagesverlauf: hell am Tag, gedämpft am Abend, schwach in der Nacht</title>
<desc id="desc">Schematischer Tagesverlauf in drei Phasen: Tagsueber helles, blendschutzfreies Licht und Tageslicht; am Abend gedaempftes, warmes Licht; in der Nacht schwache Bodenlinie oder Nachtlicht fuer den Weg. Kein Produkt und keine Lux-Vorgabe.</desc>
<rect width="1200" height="760" fill="#f7f5ef"/>
<text x="44" y="48" fill="#245b47" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600">WOHNEN · LICHT</text>
<text x="44" y="106" fill="#243b35" font-family="Georgia,'Times New Roman',serif" font-size="42">Drei Phasen, ein Plan</text>
<line x1="100" y1="480" x2="1100" y2="480" stroke="#d8dfd6" stroke-width="3"/>
<circle cx="240" cy="300" r="62" fill="#f2d27c" stroke="#245b47" stroke-width="3"/>
<text x="240" y="392" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle">Tag: hell</text>
<text x="240" y="424" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19" text-anchor="middle">Tageslicht nutzen,</text>
<text x="240" y="448" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19" text-anchor="middle">mehrere Quellen, kein Blenden</text>
<circle cx="600" cy="300" r="62" fill="#e8a95f" stroke="#245b47" stroke-width="3"/>
<text x="600" y="392" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle">Abend: gedaempft</text>
<text x="600" y="424" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19" text-anchor="middle">warmes, niedrigeres Licht,</text>
<text x="600" y="448" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19" text-anchor="middle">harte Schatten vermeiden</text>
<circle cx="960" cy="300" r="62" fill="#3f4a58" stroke="#245b47" stroke-width="3"/>
<text x="960" y="392" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle">Nacht: schwach</text>
<text x="960" y="424" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19" text-anchor="middle">Nachtlicht oder Bodenfuehrung</text>
<text x="960" y="448" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19" text-anchor="middle">von Bett bis Bad</text>
<path d="M302 300 H538 M662 300 H898" fill="none" stroke="#245b47" stroke-width="4" stroke-linecap="round"/>
<rect x="100" y="520" width="1000" height="150" rx="14" fill="#ffffff" stroke="#d8dfd6" stroke-width="2"/>
<text x="130" y="562" fill="#243b35" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="23" font-weight="600">Wege sicher machen</text>
<text x="130" y="596" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20">Kontraste helfen der Orientierung: Tueren, Stufen und Schalter optisch absetzen. Bewegungsmelder erzielen Licht ohne</text>
<text x="130" y="624" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20">Suchen nach dem Schalter. Leitungen, Schalterplaetze und Leuchtmitteltypen vor dem Kauf gemeinsam durchgehen.</text>
<text x="130" y="652" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="20">Stromverbrauch und Wirkung im Tagesverlauf als Entscheidungskriterium nutzen.</text>
<path d="M44 700 H1156" fill="none" stroke="#d8dfd6" stroke-width="2"/>
<text x="44" y="736" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="22">Allgemeine Orientierung ohne Messwerte und ohne Produktempfehlung.</text>
<text x="44" y="756" fill="#53655e" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="22">KI-Illustration · schematisch</text>
</svg>
