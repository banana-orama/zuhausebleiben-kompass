<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Zu Hause beginnt die Orientierung</title>
<desc id="desc">Schematischer Wohnraum ohne Personen: Sitzbereich, offener Durchgang und Treppe. Drei Orientierungspunkte: Alltag verstehen, Wege ansehen und Umbau abwägen. Keine reale Wohnung und keine technische Planung.</desc>
