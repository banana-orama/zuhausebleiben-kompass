<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
<title id="title">Treppenlift: erst Fragen, dann Aufmaß</title>
<desc id="desc">Schematische Treppe ohne Lift, Schiene oder Montagevorschlag. Markiert sind Zugang, Treppenverlauf und oberer Treppenbereich. Dazu Fragen zu Platz, Engstellen und Ein- und Ausstieg. Die Eignung muss vor Ort fachlich geprüft werden.</desc>
<rect width="1000" height="930" fill="#f7f5ef"/>
<text x="44" y="48" fill="#245b47" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">TREPPENLIFT · PLANUNG</text>
<text x="44" y="108" fill="#243b35" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" text-anchor="start">Treppenlift: erst Fragen, dann Aufmaß</text>
<rect x="44" y="164" width="520" height="584" rx="4" fill="#fff" stroke="#d8dfd6" stroke-width="2"/><text x="76" y="213" fill="#243b35" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" text-anchor="start">Bestand ansehen</text><path d="M101 655 V597 H175 V540 H249 V483 H323 V426 H397 V369 H496" fill="none" stroke="#245b47" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M101 655 H497 V369" fill="none" stroke="#d8dfd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M101 694 H497" fill="none" stroke="#53655e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 9"/><text x="90" y="725" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Kein Lift eingezeichnet.</text><circle cx="145" cy="615" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="145" y="625" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">1</text><circle cx="286" cy="460" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="286" y="470" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">2</text><circle cx="456" cy="344" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="456" y="354" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">3</text><text x="600" y="208" fill="#243b35" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" text-anchor="start">Vor dem Aufmaß fragen</text><circle cx="622" cy="267" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="622" y="277" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">1</text><text x="662" y="279" fill="#243b35" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start">Zugang &amp; Platz</text><text x="600" y="327" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Wie gelangen Sie zur Treppe?</text><text x="600" y="367" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Was muss frei bleiben?</text><path d="M600 399 H954" fill="none" stroke="#d8dfd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="622" cy="448" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="622" y="458" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">2</text><text x="662" y="460" fill="#243b35" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start">Treppenverlauf</text><text x="600" y="508" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Gerade, Kurve oder Podest?</text><text x="600" y="548" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Wo liegen Engstellen?</text><path d="M600 580 H954" fill="none" stroke="#d8dfd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="622" cy="629" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="622" y="639" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">3</text><text x="662" y="641" fill="#243b35" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start">Ein- und Ausstieg</text><text x="600" y="689" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Wo wäre der Wechsel möglich?</text><text x="600" y="729" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Welche Hilfe ist nötig?</text><text x="44" y="809" fill="#245b47" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Eignung, Befestigung und freie Wege vor Ort fachlich prüfen.</text>
