<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" role="img" aria-labelledby="title desc">
<title id="title">Förderung: den Ablauf vorher klären</title>
<desc id="desc">Vier schematische Schritte: Voraussetzungen klären; Angebot und Antrag nach den Regeln des konkreten Programms vorbereiten; Entscheidung und geltende Freigaben beachten; Umsetzung und Nachweise nach Programmregeln planen. Kein Förderversprechen und keine universelle Antrags- oder Auftragsregel.</desc>
<rect width="1000" height="1090" fill="#f7f5ef"/>
<text x="44" y="48" fill="#245b47" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">FÖRDERUNG · ORIENTIERUNG</text>
<text x="44" y="108" fill="#243b35" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" text-anchor="start">Förderung: den Ablauf vorher klären</text>
<text x="44" y="164" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Der konkrete Ablauf richtet sich nach dem Förderprogramm.</text><rect x="114" y="213" width="842" height="147" rx="4" fill="#fff" stroke="#d8dfd6" stroke-width="2"/><circle cx="66" cy="259" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="66" y="269" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">1</text><text x="142" y="261" fill="#243b35" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="600" text-anchor="start">Voraussetzungen klären</text><text x="142" y="302" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Programm, Berechtigung und verfügbare Mittel prüfen.</text><path d="M66 286 V403" fill="none" stroke="#245b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M57 393 L66 403 L75 393" fill="none" stroke="#245b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="114" y="392" width="842" height="147" rx="4" fill="#fff" stroke="#d8dfd6" stroke-width="2"/><circle cx="66" cy="438" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="66" y="448" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">2</text><text x="142" y="440" fill="#243b35" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="600" text-anchor="start">Angebot / Antrag vorbereiten</text><text x="142" y="481" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Angebot und Antrag nach den Programmregeln.</text><text x="142" y="523" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Zeitpunkt und nötige Unterlagen ausdrücklich klären.</text><path d="M66 465 V582" fill="none" stroke="#245b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M57 572 L66 582 L75 572" fill="none" stroke="#245b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="114" y="571" width="842" height="147" rx="4" fill="#fff" stroke="#d8dfd6" stroke-width="2"/><circle cx="66" cy="617" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="66" y="627" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">3</text><text x="142" y="619" fill="#243b35" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="600" text-anchor="start">Entscheidung abwarten</text><text x="142" y="660" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Bedingungen und Freigaben des Programms beachten.</text><text x="142" y="702" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Eine Bewilligung ist nicht garantiert.</text><path d="M66 644 V761" fill="none" stroke="#245b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M57 751 L66 761 L75 751" fill="none" stroke="#245b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="114" y="750" width="842" height="147" rx="4" fill="#fff" stroke="#d8dfd6" stroke-width="2"/><circle cx="66" cy="796" r="23" fill="#245b47" stroke="#245b47" stroke-width="3"/><text x="66" y="806" fill="#fff" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">4</text><text x="142" y="798" fill="#243b35" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="600" text-anchor="start">Umsetzung planen</text><text x="142" y="839" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Nach Entscheidung und geltenden Freigaben umsetzen.</text><text x="142" y="881" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start">Nachweise und Abrechnung nach Programmregeln.</text><text x="44" y="968" fill="#245b47" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">Keine allgemeingültige Antrags- oder Auftragsregel.</text>
<path d="M44 992 H956" fill="none" stroke="#d8dfd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="1032" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Orientierung, keine Förderberatung oder Bewilligungszusage.</text>
<text x="44" y="1066" fill="#53655e" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">KI-Illustration · schematisch</text>
</svg>