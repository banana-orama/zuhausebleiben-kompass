<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc">
<title id="title">Treppenlift mieten: was in ein Angebot gehört</title>
<desc id="desc">Schematische Darstellung eines Treppenlift-Mietangebots mit acht Positionen: Einmalige Bereitstellungskosten, monatliche Mietrate, Leistungen in der Rate, Mindestmietdauer, Kündigungsfrist, Rückbau, Rechnungslegung und Vergleich mit dem Kaufgesamtpreis. Alle Beträge sind erfundene Beispielwerte; im Beispiel liegt der Kauf ab rund zwei Jahren Nutzung vorn.</desc>
<rect width="1000" height="830" fill="#f7f5ef"/>
<text x="44" y="48" fill="#245b47" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start">TREPPENLIFT · MIETANGEBOT</text>
<text x="44" y="106" fill="#243b35" font-family="Georgia,'Times New Roman',serif" font-size="40" text-anchor="start">Was in einem Mietangebot stehen muss</text>
<text x="44" y="142" fill="#5a6b60" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="18">Acht Positionen zum Nachfragen – Beispielwerte sind erfunden</text>

<!-- document skeleton -->
<rect x="44" y="170" width="700" height="556" rx="14" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>
<rect x="44" y="170" width="700" height="54" rx="14" fill="#245b47"/>
<rect x="44" y="200" width="700" height="24" fill="#245b47"/>
<text x="68" y="204" fill="#ffffff" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600">MIETANGEBOT – Position für Position erfragen</text>

<!-- rows: y start 244, step 52 -->
<g font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="17">
  <line x1="68" y1="248" x2="720" y2="248" stroke="#ece7db" stroke-width="1"/>
  <text x="68" y="272" fill="#243b35" font-weight="600">1 · Bereitstellungskosten (einmalig)</text>
  <text x="68" y="292" fill="#5a6b60" font-size="14">Aufmaß, Schiene, Montage, Demontage</text>
  <text x="720" y="278" fill="#245b47" font-weight="600" text-anchor="end">z. B. 1.950 €</text>
  <line x1="68" y1="306" x2="720" y2="306" stroke="#ece7db" stroke-width="1"/>
  <text x="68" y="330" fill="#243b35" font-weight="600">2 · Monatliche Mietrate</text>
  <text x="68" y="350" fill="#5a6b60" font-size="14">Betrag und Abrechnungsweise</text>
  <text x="720" y="336" fill="#245b47" font-weight="600" text-anchor="end">z. B. 145 €/Monat</text>
  <line x1="68" y1="364" x2="720" y2="364" stroke="#ece7db" stroke-width="1"/>
  <text x="68" y="388" fill="#243b35" font-weight="600">3 · Was die Rate enthält</text>
  <text x="68" y="408" fill="#5a6b60" font-size="14">Wartung? Reparaturen? Ersatzteile? Strom?</text>
  <text x="720" y="394" fill="#245b47" font-weight="600" text-anchor="end">im Beispiel: inklusive</text>
  <line x1="68" y1="422" x2="720" y2="422" stroke="#ece7db" stroke-width="1"/>
  <text x="68" y="446" fill="#243b35" font-weight="600">4 · Mindestmietdauer</text>
  <text x="68" y="466" fill="#5a6b60" font-size="14">Früher Ausstieg = Raten laufen weiter</text>
  <text x="720" y="452" fill="#b04a2f" font-weight="600" text-anchor="end">z. B. 6 Monate</text>
  <line x1="68" y1="480" x2="720" y2="480" stroke="#ece7db" stroke-width="1"/>
  <text x="68" y="504" fill="#243b35" font-weight="600">5 · Kündigungsfrist und Verlängerung</text>
  <text x="68" y="524" fill="#5a6b60" font-size="14">Was passiert nach der Mindestlaufzeit?</text>
  <text x="720" y="510" fill="#245b47" font-weight="600" text-anchor="end">schriftlich fixieren</text>
  <line x1="68" y1="538" x2="720" y2="538" stroke="#ece7db" stroke-width="1"/>
  <text x="68" y="562" fill="#243b35" font-weight="600">6 · Rückbau und Entsorgung am Ende</text>
  <text x="68" y="582" fill="#5a6b60" font-size="14">Wer demontiert, wer trägt die Kosten?</text>
  <text x="720" y="568" fill="#245b47" font-weight="600" text-anchor="end">z. B. inklusive</text>
  <line x1="68" y1="596" x2="720" y2="596" stroke="#ece7db" stroke-width="1"/>
  <text x="68" y="620" fill="#243b35" font-weight="600">7 · Rechnungslegung</text>
  <text x="68" y="640" fill="#5a6b60" font-size="14">Miete = wiederkehrende Leistung, nicht Einmalkauf</text>
  <text x="720" y="626" fill="#245b47" font-weight="600" text-anchor="end">Position prüfen</text>
  <line x1="68" y1="654" x2="720" y2="654" stroke="#ece7db" stroke-width="1"/>
  <text x="68" y="678" fill="#243b35" font-weight="600">8 · Vergleich: Kaufgesamtkosten danebenlegen</text>
  <text x="68" y="698" fill="#5a6b60" font-size="14">gleiches Aufmaß, gleiche Nutzungsdauer annehmen</text>
  <text x="720" y="684" fill="#245b47" font-weight="600" text-anchor="end">immer verlangen</text>
</g>

<!-- break-even panel -->
<rect x="772" y="170" width="184" height="556" rx="14" fill="#e9efe6" stroke="#245b47" stroke-width="1.5"/>
<g font-family="'Avenir Next','Segoe UI',Arial,sans-serif">
  <text x="792" y="210" fill="#245b47" font-size="17" font-weight="600">Beispielrechnung</text>
  <text x="792" y="236" fill="#243b35" font-size="14">(erfundene Werte)</text>
  <text x="792" y="278" fill="#243b35" font-size="15">Kauf komplett:</text>
  <text x="792" y="300" fill="#245b47" font-size="16" font-weight="600">5.120 € + Wartung</text>
  <text x="792" y="336" fill="#243b35" font-size="15">Miete 12 Monate:</text>
  <text x="792" y="358" fill="#245b47" font-size="16" font-weight="600">3.690 €</text>
  <text x="792" y="394" fill="#243b35" font-size="15">Miete 36 Monate:</text>
  <text x="792" y="416" fill="#b04a2f" font-size="16" font-weight="600">7.170 €</text>
  <line x1="792" y1="440" x2="936" y2="440" stroke="#245b47" stroke-width="1"/>
  <text x="792" y="470" fill="#243b35" font-size="15">Kauf vorn ab rund</text>
  <text x="792" y="500" fill="#245b47" font-size="34" font-weight="700">24</text>
  <text x="792" y="522" fill="#245b47" font-size="15" font-weight="600">Monaten Nutzung</text>
  <text x="792" y="556" fill="#5a6b60" font-size="13">Bei kurzer, klar begrenzter</text>
  <text x="792" y="574" fill="#5a6b60" font-size="13">Nutzung kann Miete passen.</text>
  <text x="792" y="602" fill="#5a6b60" font-size="13">Bei dauerhaftem Bedarf</text>
  <text x="792" y="620" fill="#5a6b60" font-size="13">rechnen – nicht schätzen.</text>
  <text x="792" y="652" fill="#8a938c" font-size="12">Werte gelten nur für dieses</text>
  <text x="792" y="668" fill="#8a938c" font-size="12">Beispiel, kein Marktpreis.</text>
</g>

<!-- footer -->
<text x="44" y="762" fill="#5a6b60" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="15">Alle Beträge sind erfundene Beispielwerte zur Veranschaulichung der Angebotsstruktur – keine Marktpreise, keine Preisprognose.</text>
<text x="44" y="788" fill="#8a938c" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="14">Der Schienenverlauf und die konkreten Konditionen ergeben sich nur aus dem Aufmaß vor Ort und dem schriftlichen Angebot.</text>
<text x="44" y="814" fill="#8a938c" font-family="'Avenir Next','Segoe UI',Arial,sans-serif" font-size="13">Grafik: ZuhauseBleiben Kompass · Schema-Grafik, KI-unterstützt erstellt · keine reale Anlage, keine Kundenreferenz</text>
</svg>
