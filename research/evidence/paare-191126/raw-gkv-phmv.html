      grid-column: 3 / span 10;
      display: flex;
      align-self: flex-end;
    }
  }

  .nav-list {
    display: flex;
    /* Figma wants spacing-15 (60px), but this would cause the search input
       to bleed into the navigation on narrow desktop viewport widths */
    gap: var(--spacing-10);
    list-style: none;
    margin: 0;
    padding: 0;
    justify-content: flex-end;
    /* min-height: the items grow with enlarged text spacing instead of clipping the labels */
    min-height: var(--header-nav-height-desktop);
  }

  .nav-item {
    display: flex;
  }

  .nav-button {
    position: relative;
    background: transparent;
    border: 0;
    padding-block-end: 2px; /* = underline thickness (::before), keeps the label centred above it */
    padding-inline: 0;

    color: var(--color-text-1);
    cursor: pointer;
    transition: color var(--transition-base);
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

       A Lit css template cannot use mixins, so keep both in sync by hand. */
    font-family: var(--font-regular);
    font-size: var(--font-size-500);
    line-height: 130%;

    /* Reserve space for bold text to prevent layout shift */
    &::after {
      content: attr(data-text);
      font-family: var(--font-bold);
      height: 0;
      visibility: hidden;
      overflow: hidden;
      pointer-events: none;
    }

    &::before {
      content: '';
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      border-bottom: 2px solid transparent;
      transition: border-color var(--transition-base);
    }

    &:hover {
      color: var(--color-text-hover);

      &::before {
        border-bottom-color: var(--color-primary);
      }
    }

    &:focus-visible {
      outline: 2px solid var(--color-text-hover);
      outline-offset: 2px;
    }

    &[aria-expanded='true'] {
      color: var(--color-text-secondary-1);
      font-family: var(--font-bold);

      &::before {
        border-bottom-color: var(--color-primary);
      }
    }
  }

  .search {
    width: 100%;
    flex-shrink: 0;
    display: none;

    @media (min-width: 1024px) {
      grid-column: 14 / span 3;
      display: block;
    }

  .search-form {
    display: flex;
    align-items: center;
    /* 8px: the field's clear (×) is only 12px wide but carries an invisible 24px
       hit area (WCAG 2.2 SC 2.5.8) reaching 6px past it on each side. A smaller
       gap lets that area cover the submit button's left edge — and since
       .search-field has a stacking context, it wins that strip and swallows
       clicks meant for the magnifier. 8px keeps both targets a full 24px and
       clear of each other. */
    gap: var(--spacing-2);
    border: 1px solid var(--color-border-secondary-light);
    border-radius: var(--radius-sm);
    background: var(--color-white);
    padding: var(--spacing-2) var(--spacing-3) var(--spacing-2) var(--spacing-4);

       Mirrors the shared form-text-input mixin (_form-controls.scss). */
    outline: 2px solid transparent;
    outline-offset: 2px;
    transition:
      border-color var(--transition-base),
      outline-color var(--transition-base);

    &:hover,
    &:focus-within {
      border-color: var(--color-secondary-dark);
      outline: 2px solid var(--color-secondary-dark);
      outline-offset: 2px;

       itself and which has to cover the page under the header. */
    position: relative;
    z-index: 1;
    flex: 1;
    min-width: 0;

       the field, which draws nothing in the bare variant. Left alone the list
       lines up with the input: too narrow, and across the frame's bottom border.
       These three push it out to the row's own edges, each term built from what
       the row defines above:

         right  submit button + its gap + right padding + border

  .search-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--color-text-1);
    cursor: pointer;
    transition: color var(--transition-base);
    flex-shrink: 0;

    &:hover {
      color: var(--color-text-hover);
    }

      outline: 2px solid var(--color-text-hover);
      outline-offset: 2px;
    }

    &:active {
      color: var(--color-text-active);
    }
  }

    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--icon-size-xs);
    height: var(--icon-size-xs);

      width: 100%;
      height: 100%;
    }

    display: flex;
    align-items: center;
    gap: var(--spacing-6);
    margin-left: auto;

    }

    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--icon-size-lg);
    height: var(--icon-size-lg);
    padding: 0;
    border: none;
    background: transparent;
    color: var(--color-text-2);
    cursor: pointer;

      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: var(--icon-size-xl);
      height: var(--icon-size-xl);
      z-index: 0;

      outline-offset: var(--spacing-0-5);

      color: var(--color-white);

      background-color: var(--color-text-active);
      color: var(--color-white);
    }

  .mobile-btn-icon {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--icon-size-lg);
    height: var(--icon-size-lg);
    transition:
      background-color var(--transition-base),
      color var(--transition-base);

      width: var(--icon-size-md);
      height: var(--icon-size-md);

    }

    position: fixed;
    top: var(--header-height-mobile);
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1001;

    }
  }

  .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    border: none;
    padding: 0;
    cursor: pointer;

    &:focus {
      outline: none;
    }
  }

    position: relative;
    background: var(--color-white);
    padding: var(--spacing-5);
    box-shadow: var(--shadow-lg);
    z-index: 1;

  }

  .flyout--menu {

    flex-direction: column;

    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-1);
  }

  .mobile-nav-item {
    border-bottom: 1px solid var(--color-border-secondary-light);

    display: block;
    padding: var(--spacing-4) var(--spacing-2);

    color: var(--color-text-1);

      color: var(--color-text-hover);
    }

      outline: 2px solid var(--color-text-hover);
      outline-offset: 2px;
    }

      color: var(--color-text-active);
    }

<m010-text-image   data-source="{&quot;copyText&quot;:&quot;&lt;p&gt;Der GKV-Spitzenverband hat zwischenzeitlich sowohl mit Einzelleistungserbringern als auch mit Verbänden neue beitrittsfähige Verträge nach § 78 Absatz 1 SGB XI in Verbindung mit § 127 SGB V über die Versorgung der Versicherten mit zum Verbrauch bestimmten Pflegehilfsmitteln und saugenden Bettschutzeinlagen verhandelt und geschlossen, in denen neue Vertragsinhalte und Preise vereinbart sind. In diesen Verträgen werden auch neue Produkte wie FFP2-Masken und Desinfektionstücher berücksichtigt. Einzelleistungserbringer können Verträgen mit anderen Leistungserbringern und Verträgen mit Verbänden beitreten, Verbände dagegen nur Verbandsverträgen. Ein Beitritt ist nicht möglich, wenn bereits ein Vertragsverhältnis besteht, aufgrund dessen der Leistungserbringer zur Versorgung der Versicherten berechtigt ist. Bitte beachten Sie, dass es unterschiedliche Verträge gibt, denen Sie beitreten können. Es kann grundsätzlich auch in Zukunft noch weitere Vertragsschlüsse und Beitrittsverträge geben, die dann auf der Homepage des GKV-Spitzenverbandes veröffentlicht werden. Dies erfolgt technisch bedingt mit einem geringen Zeitverzug. Zum 01.06.2025 tritt ein weiterer Vertrag in Kraft. Bitte beachten Sie die gesonderten Hinweise zu diesem Vertrag unten auf der Homepage. &lt;/p&gt;&lt;p&gt;Um Ihren Beitritt zu einem der neuen Verträge über die Versorgung der Versicherten mit Pflegehilfsmitteln nach § 78 Absatz 1 SGB XI zu erklären, nutzen Sie bitte den unten angegebenen Link &lt;strong&gt;(Online-Formular zur Beitrittserklärung). Bitte drucken Sie sich die von Ihnen ausgefüllte Beitrittserklärung aus und senden Sie uns diese unterschrieben per Post zu.&lt;/strong&gt; Der Beitritt wird frühestens mit dem postalischen Zugang der unterschriebenen Beitrittserklärung beim GKV-Spitzenverband wirksam. &lt;/p&gt;&lt;p&gt;In der Beitrittserklärung sind das AC/TK der entsprechenden Vertragsversion (siehe Dokumente Vertragstexte) und der dazugehörige Vertragspartner des konkreten Vertrages, dem beigetreten wird, anzugeben.&lt;/p&gt;&lt;p&gt;Um die rechtzeitige Bearbeitung Ihres Beitritts zu gewährleisten, bitten wir Sie, Ihren Beitritt spätestens bis zum 15. eines Monats gegenüber dem GKV-Spitzenverband zu erklären. Bei später eingehenden Beitrittserklärungen kann eine Teilnahme an der Versorgung erst zum Beginn des übernächsten Monats erfolgen. Sollten Sie mit uns verhandeln wollen, kann ein Beitritt oder Vertragsschluss ebenfalls erst später erfolgen.&lt;/p&gt;&lt;p&gt;Bitte beachten Sie, dass für den Beitritt eine Präqualifizierung gemäß § 126 SGB V für den Versorgungsbereich 19B oder 19D erforderlich ist. Eine Ausnahme gilt für Apotheken, die aufgrund der gesetzlichen Neuregelung des § 126 Absatz 1b SGB V für die Abgabe zum Verbrauch bestimmter Pflegehilfsmitteln ab dem 01.04.2024 keinen Präqualifizierungsnachweis mehr benötigen.&lt;/p&gt;&lt;p&gt;Weitere Informationen zum Beitrittsverfahren und zu den neuen Verträgen können Sie dem nachfolgend aufgeführten Dokument „Fragen und Antworten“ entnehmen.&lt;/p&gt;&quot;,&quot;imagePosition&quot;:&quot;left landscape&quot;}" ssr><template shadowroot="open" shadowrootmode="open"><!--lit-part nGoU4kKZHQs=-->

</style><!--lit-part ojJ9hv6HqTI=--><!--lit-node 0--><div class=" content content--copy-l "><!--lit-part 4A33jJknpA4=--><p>Der GKV-Spitzenverband hat zwischenzeitlich sowohl mit Einzelleistungserbringern als auch mit Verbänden neue beitrittsfähige Verträge nach § 78 Absatz 1 SGB XI in Verbindung mit § 127 SGB V über die Versorgung der Versicherten mit zum Verbrauch bestimmten Pflegehilfsmitteln und saugenden Bettschutzeinlagen verhandelt und geschlossen, in denen neue Vertragsinhalte und Preise vereinbart sind. In diesen Verträgen werden auch neue Produkte wie FFP2-Masken und Desinfektionstücher berücksichtigt. Einzelleistungserbringer können Verträgen mit anderen Leistungserbringern und Verträgen mit Verbänden beitreten, Verbände dagegen nur Verbandsverträgen. Ein Beitritt ist nicht möglich, wenn bereits ein Vertragsverhältnis besteht, aufgrund dessen der Leistungserbringer zur Versorgung der Versicherten berechtigt ist. Bitte beachten Sie, dass es unterschiedliche Verträge gibt, denen Sie beitreten können. Es kann grundsätzlich auch in Zukunft noch weitere Vertragsschlüsse und Beitrittsverträge geben, die dann auf der Homepage des GKV-Spitzenverbandes veröffentlicht werden. Dies erfolgt technisch bedingt mit einem geringen Zeitverzug. Zum 01.06.2025 tritt ein weiterer Vertrag in Kraft. Bitte beachten Sie die gesonderten Hinweise zu diesem Vertrag unten auf der Homepage. </p><p>Um Ihren Beitritt zu einem der neuen Verträge über die Versorgung der Versicherten mit Pflegehilfsmitteln nach § 78 Absatz 1 SGB XI zu erklären, nutzen Sie bitte den unten angegebenen Link <strong>(Online-Formular zur Beitrittserklärung). Bitte drucken Sie sich die von Ihnen ausgefüllte Beitrittserklärung aus und senden Sie uns diese unterschrieben per Post zu.</strong> Der Beitritt wird frühestens mit dem postalischen Zugang der unterschriebenen Beitrittserklärung beim GKV-Spitzenverband wirksam. </p><p>In der Beitrittserklärung sind das AC/TK der entsprechenden Vertragsversion (siehe Dokumente Vertragstexte) und der dazugehörige Vertragspartner des konkreten Vertrages, dem beigetreten wird, anzugeben.</p><p>Um die rechtzeitige Bearbeitung Ihres Beitritts zu gewährleisten, bitten wir Sie, Ihren Beitritt spätestens bis zum 15. eines Monats gegenüber dem GKV-Spitzenverband zu erklären. Bei später eingehenden Beitrittserklärungen kann eine Teilnahme an der Versorgung erst zum Beginn des übernächsten Monats erfolgen. Sollten Sie mit uns verhandeln wollen, kann ein Beitritt oder Vertragsschluss ebenfalls erst später erfolgen.</p><p>Bitte beachten Sie, dass für den Beitritt eine Präqualifizierung gemäß § 126 SGB V für den Versorgungsbereich 19B oder 19D erforderlich ist. Eine Ausnahme gilt für Apotheken, die aufgrund der gesetzlichen Neuregelung des § 126 Absatz 1b SGB V für die Abgabe zum Verbrauch bestimmter Pflegehilfsmitteln ab dem 01.04.2024 keinen Präqualifizierungsnachweis mehr benötigen.</p><p>Weitere Informationen zum Beitrittsverfahren und zu den neuen Verträgen können Sie dem nachfolgend aufgeführten Dokument „Fragen und Antworten“ entnehmen.</p><!--/lit-part--></div><!--/lit-part--></template></html-content-renderer><!--/lit-part-->

<m010-text-image   data-source="{&quot;copyText&quot;:&quot;&lt;h4&gt;Hinweise zu noch bestehenden Altverträgen: &lt;/h4&gt;&lt;p&gt;Bis zu ihrer Ablösung und Beendigung gilt Folgendes: Bezüglich der partikelfiltrierende Halbmasken (FFP2- oder vergleichbare Masken) wurde im Zuge der am 11.03.2022 bekannt gemachten und veröffentlichten Fortschreibung der Produktgruppe 54 „Zum Verbrauch bestimmte Pflegehilfsmittel“ des Pflegehilfsmittelverzeichnisses eine eigene neue Produktart (54.99.01.5) gebildet und eine Abrechnungspositionsnummer (54.99.01.5001) eingerichtet. Für derartige partikelfiltrierende Halbmasken sind in den Altverträgen noch keine Vertragspreise vereinbart. Die Abrechnung hat daher zu marktüblichen und wirtschaftlichen Preisen zu erfolgen. Gleiches gilt für Einmallätzchen, für die in den Altverträgen ebenfalls keine Vertragspreise existieren. Hier ist entsprechend zu verfahren. Unabhängig hiervon gilt, dass die Aufwendungen der Pflegekassen für zum Verbrauch bestimmte Pflegehilfsmittel den Betrag von 40 Euro bzw. ab dem 01.01.2025 den Betrag von 42 Euro monatlich nicht übersteigen dürfen (vgl. § 40 Absatz 2 SGB XI i. V. m. § 30 Absatz 1 und Absatz 2 SGB XI).&lt;/p&gt;&quot;,&quot;imagePosition&quot;:&quot;left landscape&quot;}" ssr><template shadowroot="open" shadowrootmode="open"><!--lit-part nGoU4kKZHQs=-->

</style><!--lit-part ojJ9hv6HqTI=--><!--lit-node 0--><div class=" content content--copy-l "><!--lit-part 6ypT+aqiBnk=--><h4>Hinweise zu noch bestehenden Altverträgen: </h4><p>Bis zu ihrer Ablösung und Beendigung gilt Folgendes: Bezüglich der partikelfiltrierende Halbmasken (FFP2- oder vergleichbare Masken) wurde im Zuge der am 11.03.2022 bekannt gemachten und veröffentlichten Fortschreibung der Produktgruppe 54 „Zum Verbrauch bestimmte Pflegehilfsmittel“ des Pflegehilfsmittelverzeichnisses eine eigene neue Produktart (54.99.01.5) gebildet und eine Abrechnungspositionsnummer (54.99.01.5001) eingerichtet. Für derartige partikelfiltrierende Halbmasken sind in den Altverträgen noch keine Vertragspreise vereinbart. Die Abrechnung hat daher zu marktüblichen und wirtschaftlichen Preisen zu erfolgen. Gleiches gilt für Einmallätzchen, für die in den Altverträgen ebenfalls keine Vertragspreise existieren. Hier ist entsprechend zu verfahren. Unabhängig hiervon gilt, dass die Aufwendungen der Pflegekassen für zum Verbrauch bestimmte Pflegehilfsmittel den Betrag von 40 Euro bzw. ab dem 01.01.2025 den Betrag von 42 Euro monatlich nicht übersteigen dürfen (vgl. § 40 Absatz 2 SGB XI i. V. m. § 30 Absatz 1 und Absatz 2 SGB XI).</p><!--/lit-part--></div><!--/lit-part--></template></html-content-renderer><!--/lit-part-->

&gt;&quot;},{&quot;headline&quot;:&quot;Was sind Dienste-Cookies?&quot;,&quot;content&quot;:&quot;&lt;p&gt;Wir bieten vereinzelt Dienste von anderen Unternehmen (Dritter) an, um Inhalte anzuzeigen. Mit Ihrer Zustimmung werden anonymisierte Daten zur Performance und zum Nutzungsverhalten an den Drittanbieter übertragen. Wenn Sie diese Cookies deaktivieren, können wir Ihnen diese Inhalte nicht anzeigen.&lt;/p&gt;\n    &lt;dl class=\&quot;cookie-consent__cookie-list\&quot;&gt;\n      &lt;dt&gt;Bing Maps (Microsoft Corporation)&lt;/dt&gt;\n      &lt;dd&gt;Für die Anzeige interaktiver Landkarten direkt auf unserer Website.&lt;br&gt;Es werden die IP-Adresse, Standortdaten (sofern am Gerät freigegeben), Browsertyp, Interaktionsdaten mit der Karte an Server von Microsoft (auch in die USA) übertragen und dort gespeichert.&lt;/dd&gt;\n      &lt;dt&gt;movingimage (movingimage EVP GmbH)&lt;/dt&gt;\n      &lt;dd&gt;Für die Anzeige von Videos und Livestreams.&lt;br&gt;Dieser Dienst ermöglicht das Einbetten und fehlerfreie Abspielen von Videos direkt auf unserer Website sowie die Analyse der Videonutzung (z. B. Wiedergabedauer, View-Events), um unsere Videoinhalte zu optimieren. Es werden die IP-Adresse, Video-ID, Einbettungs-URL, Browsertyp, Geräteeinstellungen, Wiedergabestatistiken (z. B. Lautstärke) verarbeitet. Die Daten werden auf europäischen Servern des deutschen Anbieters movingimage DSGVO-konform verarbeitet. Es findet kein Transfer in unsichere Drittstaaten statt.&lt;/dd&gt;\n    &lt;/dl&gt;&quot;}],&quot;acceptSelectedLabel&quot;:&quot;Auswahl akzeptieren&quot;,&quot;rejectAllLabel&quot;:&quot;Alle ablehnen&quot;,&quot;acceptAllLabel&quot;:&quot;Alle akzeptieren&quot;,&quot;categoriesLegend&quot;:&quot;Cookie-Kategorien&quot;,&quot;engineUnavailableLabel&quot;:&quot;Ihre Auswahl konnte nicht gespeichert werden, weil die Cookie-Verwaltung nicht geladen wurde. Bitte deaktivieren Sie einen möglichen Inhaltsblocker und laden Sie die Seite neu.&quot;}" ssr><template shadowr
